[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewam"
version = "1.0"
description = "ReWAM: representation-centric world-action modeling"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.12.0",
  "av==15.1.0",
  "boto3==1.35.99",
  "datasets==4.1.1",
  "deepspeed==0.18.5",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.35.3",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "lerobot==0.4.4",
  "modelscope==1.34.0",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "opencv-python-headless==4.11.0.86",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==11.3.0",
  "pyarrow==23.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.8.0",
  "torchcodec==0.7",
  "torchvision==0.23.0",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "typing-extensions==4.15.0",
  "wandb==0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rewam*"]
exclude = ["third_party*", "scripts*", "build*"]
